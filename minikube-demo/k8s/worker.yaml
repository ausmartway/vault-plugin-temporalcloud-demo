# The money-transfer worker, connected to Temporal Cloud with a Vault-issued
# API key.
#
# The Secret this mounts is not in this file, and not in this repo. VSO creates
# it from a VaultDynamicSecret, so the credential never exists in git or passes
# through run.sh. Applying this manifest without the VSO resources leaves the
# pod waiting for a credential, which is the correct failure.
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-connection
  labels:
    app: money-transfer-worker
data:
  # Filled in by run.sh from `tcld namespace get`, because the regional endpoint
  # and namespace differ per account. Hardcoding either one breaks the demo for
  # the next person who clones this.
  TEMPORAL_ADDRESS: PLACEHOLDER_ADDRESS
  TEMPORAL_NAMESPACE: PLACEHOLDER_NAMESPACE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-transfer-worker
  labels:
    app: money-transfer-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: money-transfer-worker
  template:
    metadata:
      labels:
        app: money-transfer-worker
    spec:
      # A worker holds no local state, so it can go straight down. The default
      # 30s grace period would make every rollout drag on stage for no benefit.
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: money-transfer-worker:local
          # The image is side-loaded with `minikube image load`, not pulled.
          # Never, rather than IfNotPresent, so a stale cached tag can never be
          # mistaken for a fresh build.
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: temporal-connection
          volumeMounts:
            - name: vault-creds
              mountPath: /vault/creds
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: vault-creds
          secret:
            # Mounted as a file rather than injected as an environment variable.
            # kubelet refreshes a mounted Secret in place, which is what lets
            # Vault rotate this key without restarting the pod.
            secretName: temporal-api-key
            items:
              # key is the Secret's data key; path is the filename in the
              # volume. They differ on purpose: api_key matches the field the
              # Vault plugin returns (and therefore what VSO writes), while
              # api-key keeps the worker reading /vault/creds/api-key exactly as
              # before. The Worker never participates in VSO's lease lifecycle.
              - key: api_key
                path: api-key
