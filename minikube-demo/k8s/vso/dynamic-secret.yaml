# The credential itself: VSO reads temporalcloud/creds/demo-k8s-worker-vso and
# keeps Secret/temporal-api-key filled with the result.
#
# The Vault role's ttl equals its max_ttl, so a lease can never be renewed into
# a longer life. VSO therefore has to mint a genuinely new Temporal Cloud key
# every couple of minutes, and the worker picks each one up without restarting.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: temporal-api-key
  namespace: temporal-demo
spec:
  vaultAuthRef: temporal-vault-auth
  mount: temporalcloud
  path: creds/demo-k8s-worker-vso
  destination:
    name: temporal-api-key
    create: true
  # Rotate early, and the reason is kubelet rather than Vault.
  #
  # Two clocks have to be kept apart. Vault deletes the old Temporal Cloud key
  # the moment its lease expires, while kubelet refreshes a mounted Secret only
  # on its own sync cycle — up to a minute. The gap VSO leaves between writing
  # the new key and Vault deleting the old one is the budget kubelet has to
  # project it into the pod. Run out of budget and the worker is holding a key
  # Temporal Cloud has already deleted, which it reports as
  # `Request unauthorized`.
  #
  # Measured on this demo, over the two-minute lease:
  #
  #   90%  rotates ~108s in, ~12s of budget — a burst of refused polls at every
  #        rotation, and the SDK's retry backoff turned one ten-second gap into
  #        a minute-long stall on an in-flight transfer
  #   50%  rotates  ~91s in, ~29s of budget — one refused poll in five minutes
  #   25%  rotates  ~66s in, ~54s of budget — none at all in seven minutes
  #        across seven rotations
  #
  # The percentage is not the rotation point on its own: VSO renews first, and
  # Vault caps each renewal at max_ttl, so the re-read lands later than the raw
  # percentage suggests. The numbers above are what that actually produced.
  #
  # The cost of rotating early is one refused renewal per cycle — ttl == max_ttl,
  # so the renewal cannot extend the lease and VSO reads a new credential
  # instead. That refusal is the LeaseRenewal=False condition `./run.sh status`
  # explains, and it is the mechanism being demonstrated, not a fault.
  renewalPercent: 25
  # Revoke this resource's lease when the resource is deleted, so `down` does
  # not leave a key alive in Temporal Cloud. Note this fires on deletion only —
  # it does nothing on rotation, where the old lease is simply left to expire.
  revoke: true
  #
  # rolloutRestartTargets is deliberately absent.
  #
  # VSO offers it for applications that cannot pick up a rotated credential
  # without restarting. This worker re-reads its key from the mounted Secret on
  # every request, so restarting the pod is precisely the thing this demo exists
  # to disprove. Adding the field would leave the demo still "working" while
  # proving nothing.
