# Vault in dev mode: in-memory, auto-unsealed, single known root token.
# Fine for a demo, never for anything real.
services:
  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.20}
    container_name: vault-temporalcloud-demo
    ports:
      # Host port comes from .env so it can be moved if 8200 is taken.
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      # Lets Vault mlock its memory so secrets are never swapped to disk.
      - IPC_LOCK
    volumes:
      # The plugin binary is fetched to ./plugins by scripts/fetch-plugin.sh
      # before this container starts — Vault scans the directory at boot.
      - ./plugins:/vault/plugins
    command: server -dev -dev-plugin-dir=/vault/plugins
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 15
